<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Sumflow, l'usine à nombres : un jeu d'usine calme pour navigateur. Extraire des nombres, les combiner, les livrer."
    />
    <meta name="theme-color" content="#26332b" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- The handwriting font draws the numbers on the map too: fetch it early. -->
    <link
      rel="preload"
      href="./fonts/patrick-hand-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
